<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>WhatsApp Digest</title>
<style>
  body { font: 16px/1.6 system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 0 16px; background: #f6f6f4; color: #222; }
  @media (prefers-color-scheme: dark) { body { background: #1b1b1a; color: #eee; } a { color: #8ab4f8; } }
  p { text-align: center; }
</style>
</head>
<body>
<p id="msg">接続先を確認しています…</p>
<script>
fetch("url.json?t=" + Date.now(), { cache: "no-store" })
  .then(r => r.json())
  .then(j => { location.replace(j.url + location.hash); })
  .catch(() => {
    document.getElementById("msg").textContent =
      "接続先が見つかりません。サーバーのPCが起動しているか確認してください。";
  });
</script>
</body>
</html>
